<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for SAPXG Tech training programs. Fill your details and upload your resume.">
  <title>Register | SAPXG Tech Private Limited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.3">
  <style>
    .register-page { min-height: 100vh; background: var(--grey); }

    .register-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px clamp(22px,8vw,128px);
      background: var(--white); border-bottom: 1px solid var(--line);
    }
    .register-header .full-logo { width: 180px; }
    .register-back {
      font: 600 13px 'DM Sans', sans-serif;
      color: var(--ink); border-bottom: 2px solid var(--yellow); padding-bottom: 3px;
    }
    .register-back:hover { color: var(--blue); }

    .register-content {
      max-width: 680px; margin: 0 auto;
      padding: clamp(40px,6vw,72px) clamp(22px,6vw,48px);
    }

    .register-title-area { margin-bottom: 36px; }
    .register-label {
      display: flex; align-items: center; gap: 9px;
      color: var(--muted); font: 700 11px 'Space Grotesk', sans-serif;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;
    }
    .register-label span {
      width: 8px; height: 8px; background: var(--yellow); border-radius: 50%;
    }
    .register-title-area h1 {
      font: 600 clamp(28px,4vw,40px)/1.1 'Space Grotesk', sans-serif;
      letter-spacing: -0.5px; margin: 0 0 12px; color: var(--ink);
    }
    .register-title-area h1 em { font-style: normal; color: var(--blue); }
    .register-subtitle {
      color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0;
    }
    .selected-course {
      display: inline-block; margin-top: 14px; padding: 8px 16px;
      background: var(--ink); color: var(--yellow);
      font: 600 13px 'Space Grotesk', sans-serif; letter-spacing: 0.3px;
    }
    .selected-course:empty { display: none; }

    /* Form */
    .register-form {
      background: var(--white); padding: clamp(28px,5vw,44px);
      box-shadow: 8px 8px 0 var(--yellow); display: grid;
      grid-template-columns: 1fr 1fr; gap: 20px 18px;
    }
    .register-form label {
      display: grid; gap: 6px;
      font: 700 10px 'Space Grotesk', sans-serif;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--ink);
    }
    .register-form label.full-width { grid-column: 1 / -1; }
    .register-form input,
    .register-form select,
    .register-form textarea {
      width: 100%; border: 0; border-bottom: 1px solid var(--line);
      padding: 10px 0; outline: none; background: transparent;
      color: var(--ink); font: 14px 'DM Sans', sans-serif;
      resize: vertical;
    }
    .register-form input:focus,
    .register-form select:focus,
    .register-form textarea:focus { border-color: var(--blue); }
    .register-form select { cursor: pointer; }

    /* Checkboxes */
    .checkbox-group {
      display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px;
    }
    .checkbox-group label {
      display: flex; flex-direction: row; align-items: center; gap: 8px; font: 600 13px 'DM Sans', sans-serif; text-transform: none; letter-spacing: normal; cursor: pointer;
    }
    .checkbox-group input { width: auto; margin: 0; padding: 0; cursor: pointer; }

    /* File upload */
    .file-upload-area {
      border: 2px dashed var(--line); padding: 28px 20px;
      text-align: center; cursor: pointer; transition: border-color .2s, background .2s;
      position: relative;
    }
    .file-upload-area:hover { border-color: var(--blue); background: var(--grey); }
    .file-upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%; border: 0; padding: 0;
    }
    .file-upload-icon { font-size: 32px; margin-bottom: 8px; }
    .file-upload-text {
      font: 600 13px 'DM Sans', sans-serif; color: var(--ink); margin: 0 0 4px;
    }
    .file-upload-hint {
      font-size: 11px; color: var(--muted); margin: 0;
    }
    .file-name {
      margin-top: 8px; font: 600 12px 'Space Grotesk', sans-serif;
      color: var(--blue); display: none;
    }
    .file-name.visible { display: block; }

    /* Submit */
    .register-form .submit-row {
      grid-column: 1 / -1; display: flex; align-items: center;
      justify-content: space-between; gap: 16px; margin-top: 8px;
    }
    .register-btn {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 15px 32px; background: var(--yellow); color: var(--ink);
      font: 700 14px 'Space Grotesk', sans-serif; letter-spacing: 0.3px;
      border: 0; cursor: pointer; transition: transform .2s, box-shadow .2s;
    }
    .register-btn:hover {
      transform: translateY(-3px); box-shadow: 4px 4px 0 var(--ink);
    }
    .register-btn span { font-size: 18px; line-height: 0; }
    .register-status {
      font-size: 13px; color: #16804c; margin: 0;
    }

    @media (max-width: 600px) {
      .register-header { padding: 18px 22px; }
      .register-header .full-logo { width: 160px; }
      .register-form { grid-template-columns: 1fr; padding: 24px 20px; box-shadow: 5px 5px 0 var(--yellow); }
      .register-form label.full-width { grid-column: auto; }
      .submit-row { flex-direction: column; align-items: stretch !important; }
    }
  </style>
</head>
<body>
  <div class="register-page">
    <header class="register-header">
      <a href="index.html" aria-label="SAPXG home"><img class="full-logo" src="sapxg logo.png" alt="SAPXG - A Smart Analytics & Planning Experts Group"></a>
      <a class="register-back" href="index.html#training">← Back to Training</a>
    </header>

    <main class="register-content">
      <div class="register-title-area">
        <div class="register-label"><span></span> Training Registration</div>
        <h1>Register for <em>Training</em></h1>
        <p class="register-subtitle">Fill in your details and upload your CV or resume. Our team will get back to you shortly.</p>
        <div class="selected-course" id="selected-course"></div>
      </div>

      <form class="register-form" id="register-form">
        <label>Name
          <input type="text" name="fullname" placeholder="Your full name" required>
        </label>
        <label>Email
          <input type="email" name="email" placeholder="you@company.com" required>
        </label>
        <label>Contact Number
          <input type="tel" name="phone" placeholder="+91" required>
        </label>
        <label>Total Experience
          <input type="text" name="totalexp" placeholder="e.g. 5 years" required>
        </label>
        <label>Relevant Experience
          <input type="text" name="relevantexp" placeholder="e.g. 3 years in SAP" required>
        </label>
        <label class="full-width">Number of projects completed in relevant platform
          <input type="text" name="projects" placeholder="e.g. 4 projects" required>
        </label>
        <label class="full-width">Upload CV / Resume
          <div class="file-upload-area" id="file-upload-area">
            <input type="file" name="resume" accept=".pdf,.doc,.docx" id="resume-input">
            <div class="file-upload-icon">📄</div>
            <p class="file-upload-text">Click or drag to upload your CV</p>
            <p class="file-upload-hint">PDF, DOC, or DOCX — Max 5MB</p>
            <p class="file-name" id="file-name"></p>
          </div>
        </label>
        <div class="full-width" style="display: grid; gap: 6px; font: 700 10px 'Space Grotesk', sans-serif; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink);">
          Technologies / Platforms
          <div class="checkbox-group">
            <label><input type="checkbox" name="technologies" value="SAC"> SAC</label>
            <label><input type="checkbox" name="technologies" value="DATASPHERE"> DATASPHERE</label>
            <label><input type="checkbox" name="technologies" value="BI/BW"> BI/BW</label>
            <label><input type="checkbox" name="technologies" value="HANA"> HANA</label>
          </div>
        </div>
        <div class="submit-row">
          <button class="register-btn" type="submit">Submit Registration <span>↗</span></button>
          <p class="register-status" id="register-status" role="status"></p>
        </div>
      </form>
    </main>
  </div>

  <script>
    // Show selected file name
    const resumeInput = document.getElementById('resume-input');
    const fileName = document.getElementById('file-name');
    resumeInput.addEventListener('change', () => {
      if (resumeInput.files.length > 0) {
        fileName.textContent = '✅ ' + resumeInput.files[0].name;
        fileName.classList.add('visible');
      } else {
        fileName.classList.remove('visible');
      }
    });

    // Pre-select course from URL parameter
    const params = new URLSearchParams(window.location.search);
    const course = params.get('course');
    if (course) {
      const courseDisplay = document.getElementById('selected-course');
      courseDisplay.textContent = '📋 ' + course;
      const select = document.getElementById('program-select');
      for (let opt of select.options) {
        if (opt.value === course) { opt.selected = true; break; }
      }
    }

    // Form submission — connected to Google Sheets + CV upload to Drive
    const REGISTER_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyzZ1y0TqBU66BJ2jrtrocjTgBtqVBd3WVbdVHc4HF7Y1uGQs14Nr3Z5xbw2W7vxYjVnQ/exec';
    const form = document.getElementById('register-form');
    const status = document.getElementById('register-status');

    // Convert file to base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(',')[1]; // remove data:...;base64, prefix
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('.register-btn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Uploading… ⏳';

      const payload = {
        fullname: form.fullname.value,
        email: form.email.value,
        phone: form.phone.value,
        totalexp: form.totalexp.value,
        relevantexp: form.relevantexp.value,
        projects: form.projects.value,
        technologies: Array.from(form.querySelectorAll('input[name="technologies"]:checked')).map(cb => cb.value).join(', '),
        fileData: '',
        fileName: '',
        fileType: ''
      };

      // Read CV file if uploaded
      const fileInput = document.getElementById('resume-input');
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        if (file.size > 5 * 1024 * 1024) {
          status.textContent = '❌ File too large. Max 5MB.';
          status.style.color = '#dc2626';
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        }
        btn.innerHTML = 'Uploading CV… ⏳';
        payload.fileData = await fileToBase64(file);
        payload.fileName = file.name;
        payload.fileType = file.type;
      }

      try {
        await fetch(REGISTER_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        status.textContent = '✅ Registration submitted! We will contact you soon.';
        status.style.color = '#16804c';
        form.reset();
        fileName.classList.remove('visible');
        document.getElementById('selected-course').textContent = '';
      } catch (err) {
        status.textContent = '❌ Something went wrong. Please try again.';
        status.style.color = '#dc2626';
      }
      btn.disabled = false;
      btn.innerHTML = originalText;
    });
  </script>

</body>
